name: PendingBot
options:
  bundleIdPrefix: com.pendingname
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # 签名策略:
    # - iOS 真机(iphoneos):Automatic + dev team(用于装机 / TestFlight)
    # - iOS Simulator + macOS:scaffold 阶段不签名(Mac 端目前只占位,不上 prod)
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: M42BKJN82S
    "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": "NO"
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": ""
    "CODE_SIGNING_REQUIRED[sdk=macosx*]": "NO"
    "CODE_SIGNING_ALLOWED[sdk=macosx*]": "NO"
    "CODE_SIGN_IDENTITY[sdk=macosx*]": ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  GRDB:
    url: https://github.com/duckduckgo/GRDB.swift
    exactVersion: 2.4.2-1
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    minVersion: 8.0.0
    maxVersion: 9.0.0
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    minVersion: 2.4.0
    maxVersion: 3.0.0
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    minVersion: 1.0.0
    maxVersion: 2.0.0
  Supabase:
    url: https://github.com/supabase/supabase-swift
    minVersion: 2.0.0
    maxVersion: 3.0.0
  WebRTC:
    url: https://github.com/stasel/WebRTC
    minVersion: 130.0.0
    maxVersion: 131.0.0
targets:
  PendingBot:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources
      - path: Resources
        # Info.plist 是 INFOPLIST_FILE 引用，不能也 copy 进 bundle
        excludes:
          - "Info.plist"
          - "PendingBot.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pendingname.pendingbot
        PRODUCT_NAME: PendingBot
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/PendingBot.entitlements
        # 1 = iPhone, 2 = iPad
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        # 不为 macOS 提供 Designed-for-iPad 模式（要真正的 SwiftUI macOS）
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        # iOS 端排除 macOS-only 子树（Sources/Mac/）
        "EXCLUDED_SOURCE_FILE_NAMES[sdk=iphone*]": "Mac/* Mac/**/*"
        # macOS 端不再用 EXCLUDED_SOURCE_FILE_NAMES 大锅排除业务子树 —
        # 改为在每个 iOS-only 文件顶部包 `#if os(iOS)` ... `#endif`,
        # 让纯 Foundation/SwiftUI 的 Models / Storage / 部分 Networking /
        # 部分 Components 自然进入 Mac build,给 Sources/Mac/ 的真实视图
        # 提供数据底座。剩余 iOS-only 业务(Features/* 等)的 Mac 接入
        # 见 docs/tech-debt.md 中的 T0.1 P1+P2 条目。
    dependencies:
      - package: GRDB
        product: GRDB
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: MarkdownUI
        product: MarkdownUI
      - package: SwiftMath
        product: SwiftMath
      - package: Supabase
        product: Supabase
      - package: WebRTC
        product: WebRTC
