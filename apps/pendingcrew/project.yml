name: PendingCrew
options:
  bundleIdPrefix: com.pendingname
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Scaffold/dev 阶段不签名（macOS build 默认要求签名）
    # 真正 deploy 时改成 Automatic + 设 DEVELOPMENT_TEAM
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  PendingCrew:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pendingname.pendingcrew
        PRODUCT_NAME: PendingCrew
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "2"
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
