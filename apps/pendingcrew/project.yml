name: PendingCrew
options:
  bundleIdPrefix: com.pendingname
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # 签名策略(与 apps/pendingbot 对齐):
    # - iPad 真机(iphoneos):Automatic + dev team(为以后装 iPad 真机准备)
    # - iOS Simulator + macOS:scaffold 阶段不签名(无需 Mac dev cert / sim 本来就不签)
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: M42BKJN82S
    "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": "NO"
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": ""
    "CODE_SIGNING_REQUIRED[sdk=macosx*]": "NO"
    "CODE_SIGNING_ALLOWED[sdk=macosx*]": "NO"
    "CODE_SIGN_IDENTITY[sdk=macosx*]": ""
targets:
  PendingCrew:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources
      - path: Resources
    scheme:
      testTargets:
        - PendingCrewTests
      gatherCoverageData: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pendingname.pendingcrew
        PRODUCT_NAME: PendingCrew
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "2"
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
  # PendingCrewTests —— macOS-only XCTest bundle for LocalRunner module.
  # 不挂 iOS，因为待测代码全在 `#if os(macOS)` guard 后面。
  PendingCrewTests:
    type: bundle.unit-test
    supportedDestinations: [macOS]
    sources:
      - path: Tests/PendingCrewTests
      # 直接把 LocalRunner 源码编进 test bundle 而不是从 app 链接 ——
      # scaffold 阶段 app 不签名，无法做完整 macOS host-app injection；
      # bundle_loader + 无 test host 又会触发 dlopen 时 swift symbol 找不到。
      # LocalRunner 模块是纯 Foundation 代码（不依赖 SwiftUI / NSApplicationMain），
      # 重复编译进 test bundle 完全没问题。
      - path: Sources/Mac/LocalRunner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pendingname.pendingcrew.tests
        GENERATE_INFOPLIST_FILE: YES
        # standalone test bundle —— 不挂 host app
        TEST_HOST: ""
        BUNDLE_LOADER: ""
