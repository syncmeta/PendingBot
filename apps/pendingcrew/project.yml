name: PendingCrew
options:
  bundleIdPrefix: com.pendingname
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    minVersion: 8.0.0
    maxVersion: 9.0.0
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    minVersion: 2.4.0
    maxVersion: 3.0.0
  Supabase:
    url: https://github.com/supabase/supabase-swift
    minVersion: 2.0.0
    maxVersion: 3.0.0
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    minVersion: 1.0.0
    maxVersion: 2.0.0
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.13.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    # 签名策略(与 apps/pendingbot 对齐 —— 同源的 keychain 坑)：
    # macOS + iOS Simulator 都用 **Apple Development** 身份(不是 ad-hoc /
    # "Sign to Run Locally")。`KeychainStore`(device-grant token，默认钥匙串、
    # kSecAttrService=com.pendingname.pendingcrew)的 ACL 绑当前签名身份；ad-hoc
    # 每次重构身份就变 → 系统认不出重建的 app → **反复弹"存取钥匙串"授权框 /
    # -34018 存不住** → 登录态丢失。用 Apple Development(稳定身份)根治。
    # headless 无证书构建会回落 ad-hoc(仅编译校验用，不影响 GUI/有证书环境正常签名)。
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: M42BKJN82S
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "Apple Development"
    "CODE_SIGN_IDENTITY[sdk=macosx*]": "Apple Development"
targets:
  PendingCrew:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      # Sources/Mcp（McpServer/HookEmitter/McpHelperMain）编进 app：re-exec self ——
      # app 二进制带 --mcp-serve/--mcp-hook argv 时当 crew-comms helper 跑（PendingCrewEntry）。
      - path: Sources
      - path: Resources
    scheme:
      testTargets:
        - PendingCrewTests
      gatherCoverageData: false
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: MarkdownUI
        product: MarkdownUI
      - package: Supabase
        product: Supabase
      - package: SwiftMath
        product: SwiftMath
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pendingname.pendingcrew
        PRODUCT_NAME: PendingCrew
        # keychain-access-groups entitlement —— 让 KeychainStore 的
        # data-protection 钥匙串项落进 app 自己的 access group(entitlement-gated)，
        # macOS 上不再反复弹"存取钥匙串"授权框。对齐 PendingBot。
        CODE_SIGN_ENTITLEMENTS: Resources/PendingCrew.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "2"
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
  # PendingCrewTests —— macOS-only XCTest bundle for LocalRunner module.
  # 不挂 iOS，因为待测代码全在 `#if os(macOS)` guard 后面。
  PendingCrewTests:
    type: bundle.unit-test
    supportedDestinations: [macOS]
    sources:
      - path: Tests/PendingCrewTests
      # 直接把 LocalRunner 源码编进 test bundle 而不是从 app 链接 ——
      # scaffold 阶段 app 不签名，无法做完整 macOS host-app injection；
      # bundle_loader + 无 test host 又会触发 dlopen 时 swift symbol 找不到。
      # LocalRunner 模块是纯 Foundation 代码（不依赖 SwiftUI / NSApplicationMain），
      # 重复编译进 test bundle 完全没问题。
      - path: Sources/Mac/LocalRunner
      # LocalWhiteboardStore 同理：自包含 Foundation 代码（本地白板持久化，
      # 不引 CrewWhiteboardEntry / app module），单独编进 bundle 单测。
      - path: Sources/Stores/LocalWhiteboardStore.swift
      # 待审批/待决策 store（ask 工具 + 权限 hook 用），同自包含。
      - path: Sources/Stores/LocalApprovalStore.swift
      # 人类 Todo 列表 store（respond_todo 工具 + 右栏面板数据层），同自包含。
      - path: Sources/Stores/LocalTodoStore.swift
      # crew-naming（2026-06-17）：控制通道 store（机长 rename_crew 写待改名）+
      # LocalCrewStore（setTitle/地名兜底）+ PlaceNames（地名池）。均自包含 Foundation；
      # PlaceNames 读 Bundle.main，测试 bundle 无 crewground_places.txt → 回落 ["Atlantis"]，
      # 不崩，断言「非『未命名』」仍成立。
      - path: Sources/Stores/LocalCrewControlStore.swift
      - path: Sources/Stores/LocalCrewStore.swift
      - path: Sources/Stores/PlaceNames.swift
      # 成员状态快照（机长 list_sessions 数据源，纯 Foundation Codable）。
      - path: Sources/Stores/CrewSessionsSnapshot.swift
      # 家族 SSO 凭据共享组存储（纯 Foundation+Security，自包含）。
      - path: Sources/Support/FamilyCredentialStore.swift
      # 机器分组纯函数（依赖 Models 里的 Machine / CrewSummary，已编进 bundle）。
      - path: Sources/Support/MachineGrouping.swift
      # 子 crew 深度 cap 纯判定（create_child_crew 机长命令）。CrewStore 依赖
      # AppModel（未编进 bundle），逻辑摘到这个自包含文件供单测直接编译。
      - path: Sources/Support/CrewChildDepthPolicy.swift
      # crew 状态点聚合纯函数（侧栏头像右上角;红>黄>绿>灰）。自包含 Foundation。
      - path: Sources/Support/CrewStatusAggregation.swift
      # 本地 prompts：PromptTemplate（纯 {{var}}）+ LocalPromptLoader（bundle 读）
      # 自包含，编进 bundle 单测；Resources/Prompts 作为 test bundle 资源，从
      # test bundle 加载验证 bundling + lookup 端到端。
      - path: Sources/Stores/PromptTemplate.swift
      - path: Sources/Stores/LocalPromptLoader.swift
      - path: Sources/Stores/LocalSessionWorldModel.swift
      # McpServer.swift / HookEmitter.swift（纯逻辑，不含 main.swift 顶层代码）编进
      # bundle 测 JSON-RPC dispatch + hook 注入。
      - path: Sources/Mcp/McpServer.swift
      - path: Sources/Mcp/HookEmitter.swift
      - path: Sources/Mcp/McpPermissionHook.swift
      - path: Resources/Prompts
      # CrewChatAdapter + isMine 单一真值源 + GroupBubbleSender SHIM（A6）
      # 只列纯 Foundation 逻辑文件，**不**整目录纳入 —— Chat/Adapter 下还有
      # CrewAvatarBadges.swift / ThemeCrewExtras.swift 等依赖 Vendored/Theme/BotAvatar
      # 的 SwiftUI 文件，整目录会把它们拖进 test bundle 而 Vendored 不在 bundle 里 → 编不过。
      - path: Sources/Chat/Adapter/CrewChatAdapter.swift
      - path: Sources/Chat/Adapter/CrewChatMessage.swift
      - path: Sources/Chat/Adapter/GroupBubbleSender.swift
      # CrewComposerMentions.swift：composer @ 候选构建/过滤 + @token 解析 +
      # staged 撤销对账 + reply 自动@推导(Phase 6)。纯 Foundation，自包含。
      - path: Sources/Chat/Adapter/CrewComposerMentions.swift
      # CrewSessionTitle.swift：session 精简标题 clamp/derive（≤18 字、剥项目名）。纯 Foundation。
      - path: Sources/Chat/Adapter/CrewSessionTitle.swift
      - path: Sources/Mac/Views/Chat/CrewSenderResolver.swift
      # CrewSenderNaming.swift：session/成员显示名兜底 + groupSender factory 收口
      # （纯 Foundation，只依赖 CrewMember/GroupBubbleSender，均已在 bundle）。
      # CrewComposerMentions / CrewSenderResolver 依赖它。
      - path: Sources/Chat/Adapter/CrewSenderNaming.swift
      # CrewModels.swift：从 PendingCrewAPI.swift 提取的 whiteboard/crew 纯
      # Foundation 模型（CrewWhiteboardEntry / CrewMember / CrewAttachment 等），
      # 不含 PendingCrewAPI 类或 URLSession 依赖。
      - path: Sources/Services/CrewModels.swift
      # CrewRealtimeClient.swift：crew 级 hub WS 客户端 + codec（纯 Foundation，
      # 跨平台）。原在 Sources/Mac/LocalRunner（随整目录编进 bundle），移到
      # Sources/Services 后需显式列出 —— CrewRealtimeClientTests 单测 codec。
      - path: Sources/Services/CrewRealtimeClient.swift
      # InMemoryKeyValueStore.swift：纯内存 KV（无 Supabase import），供
      # InMemoryAuthStorageTests 单测。CrewSupabaseStack.swift 有 import Supabase
      # 不能进 test bundle。
      - path: Sources/Services/InMemoryKeyValueStore.swift
      # CrewLoginIdentity.swift：确认卡展示模型，从 FamilyCredential 派生（纯
      # Foundation，自包含）。FamilyCredentialStore 已在 bundle。
      - path: Sources/Services/CrewLoginIdentity.swift
      # CrewLoginExchange.swift：临时 session → pfa_ → pdg_ 兑换编排（纯
      # Foundation，不含 Supabase import）。teardown 在成败两路都 await。
      - path: Sources/Services/CrewLoginExchange.swift
      # Sources/Models/（CrewDetail / CrewSummary / UserSubject / DeviceLogin /
      # ModelCatalogEntry）：LocalRunner 传递引用了这些类型。
      - path: Sources/Models
    # AgentTerminalSession.swift（在 LocalRunner 里）import SwiftTerm，所以
    # test bundle 也要链 SwiftTerm，否则编不过。
    dependencies:
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pendingname.pendingcrew.tests
        GENERATE_INFOPLIST_FILE: YES
        # standalone test bundle —— 不挂 host app
        TEST_HOST: ""
        BUNDLE_LOADER: ""
