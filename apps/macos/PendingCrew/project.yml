name: PendingCrew
options:
  bundleIdPrefix: com.pendingname
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  PendingCrew:
    type: application
    platform: macOS
    sources:
      - path: Sources/PendingCrew
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pendingname.pendingcrew
        PRODUCT_NAME: PendingCrew
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PendingCrewInfo.plist
  PendingCrewTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PendingCrewTests
    dependencies:
      - target: PendingCrew
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pendingname.pendingcrew.tests
        GENERATE_INFOPLIST_FILE: YES
  PendingCrewUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/PendingCrewUITests
    dependencies:
      - target: PendingCrew
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pendingname.pendingcrew.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PendingCrew
