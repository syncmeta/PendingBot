name: Edge checks

# 只跑**不需要任何凭据**的闸：typecheck + 单元测试。
# 签名 / 公证 / 发版一律留在本机（Developer ID 证书不上云，2026-08-20 定）。
# macOS 出包见 scripts/release/build-macos-dmg.sh。

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  typecheck-and-test:
    name: typecheck + vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # packages/identity 先过 —— edge 直接 import 它，它红了 edge 的报错会很难读
      - name: typecheck @pendingbot/identity
        run: bun --filter='@pendingbot/identity' run typecheck
      - name: typecheck @pendingbot/edge
        run: bun --filter='@pendingbot/edge' run typecheck
      # vitest 走 @cloudflare/vitest-pool-workers（workerd 本地跑，不连任何线上服务）
      - name: vitest @pendingbot/edge
        run: bun --filter='@pendingbot/edge' run test
