# Supabase project config — generated by `supabase init` equivalent.
# Run `supabase login` then `supabase link --project-ref <project-id>` to bind
# this dir to the one deployed Supabase project (we'll split staging/prod
# after launch — see CLAUDE.md).

project_id = "pendingbot"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public", "pendingbot"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

# Auto-applied by `supabase db reset`. Seeds run AFTER migrations in
# alphabetical order — the 01_/02_ prefixes pin that.
[db.seed]
enabled = true
sql_paths = ["./seeds/01_preset_bots.sql", "./seeds/02_place_names.sql"]

[realtime]
enabled = true
ip_version = "IPv4"

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

# Email templates / SMTP — configure via the Supabase dashboard
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

# Auth provider config — local dev only. Real OAuth (Apple, Google) is
# configured in the Supabase dashboard per env.
[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "http://localhost:8787/**"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"

[edge_runtime]
enabled = false

[analytics]
enabled = false

